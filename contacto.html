<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colosal Producciones - Redes Sociales</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #000;
      color: #f5f5dc;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    /* --- VIDEO DE FONDO --- */
    .video-background-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: -1;
    }

    #background-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Superposición oscura para legibilidad */
    .video-background-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }

    /* --- CONTENIDO ENCIMA DEL VIDEO --- */
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      color: #f5f5dc;
    }

    .social-links {
      margin-bottom: 20px;
    }

    .social-links a {
      display: block;
      padding: 10px 20px;
      margin: 10px 0;
      background-color: #cba9d9;
      color: #000;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.3s ease, transform 0.3s ease;
      width: 200px;
      text-align: center;
    }

    .social-links a:hover {
      transform: scale(1.05);
      background-color: #b898c6;
    }

    .back-button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #cba9d9;
      color: #000;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .back-button:hover {
      background-color: #b898c6;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- VIDEO DE FONDO -->
  <div class="video-background-container">
    <video autoplay muted loop id="background-video">
      <source src="musica/video.mp4" type="video/mp4">
      Tu navegador no soporta videos HTML5.
    </video>
  </div>

  <!-- CONTENIDO ENCIMA -->
  <div class="content">
    <h1>Sigue a Colosal</h1>
    <div class="social-links">
      <a href="https://www.instagram.com/colosalprod.pe?igsh=MXBveTJxYnZ2YmVoOA==" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="https://www.tiktok.com/@tu_usuario" target="_blank" rel="noopener noreferrer">TikTok</a>
    </div>
    <a href="index.html?from=redes" class="back-button">← Volver al Inicio</a>
  </div>

</body>
</html>
